name: Build and test
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:
    inputs:
      modrinth_loader:
        description: Loader to publish on Modrinth (GitHub always receives both)
        type: choice
        options: [both, fabric, neoforge]
        default: both
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate localization keys, Unicode and format arguments
        run: python3 scripts/validate_locales.py
      - name: Test release publication safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: chmod +x gradlew
      - run: ./gradlew build --console=plain
      - name: Validate both loader JARs and Spanish/English changelogs
        run: python3 scripts/publish_release.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: serialcraft-jar
          path: |
            build/libs/serialcraft-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
      - run: ./gradlew -PioGameTests :fabric:runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            common/build/reports/tests/
            fabric/build/reports/tests/
            fabric/build/test-results/
            fabric/build/run/gameTest/logs/
            neoforge/build/reports/tests/
            neoforge/build/test-results/

  publish:
    name: Publish JARs and notify Discord
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: serialcraft-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: serialcraft-jar
          path: release-dist
      - name: Publish verified JARs to GitHub and Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: hLV9sPrg
          MODRINTH_LOADER: ${{ inputs.modrinth_loader || 'both' }}
        run: python3 scripts/publish_release.py --publish --modrinth --modrinth-loader "$MODRINTH_LOADER" --manifest release-manifest.json --jar-dir release-dist
      - name: Sync English Modrinth description
        id: modrinth-readme
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: hLV9sPrg
        run: python3 scripts/publish_release.py --sync-readme
      - name: Notify Discord once per published loader version
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: hLV9sPrg
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/notify_discord.py --manifest release-manifest.json
      - name: Report description sync permissions
        if: steps.modrinth-readme.outcome == 'failure'
        run: |
          echo '::warning::The JARs were published, but Modrinth description sync requires PROJECT_WRITE.'
          echo 'Modrinth description sync failed; check PROJECT_WRITE permissions.' >> "$GITHUB_STEP_SUMMARY"
