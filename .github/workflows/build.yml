name: Build and test
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:
    inputs:
      publish_modrinth:
        description: Also publish to Modrinth and synchronize its description (main only)
        type: boolean
        default: false
      modrinth_loader:
        description: Loader to publish on Modrinth (GitHub always receives both)
        type: choice
        options: [both, fabric, neoforge]
        default: both
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate localization keys, Unicode and format arguments
        run: python3 scripts/validate_locales.py
      - name: Test release publication safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: chmod +x gradlew
      - run: ./gradlew build --console=plain
      - name: Validate both loader JARs and Spanish/English changelogs
        run: python3 scripts/publish_release.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: serialcraft-jar
          path: |
            build/libs/serialcraft-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
      - run: ./gradlew -PioGameTests :fabric:runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            common/build/reports/tests/
            fabric/build/reports/tests/
            fabric/build/test-results/
            fabric/build/run/gameTest/logs/
            neoforge/build/reports/tests/
            neoforge/build/test-results/

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: serialcraft-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: serialcraft-jar
          path: release-dist
      - name: Publish both verified loader JARs to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --publish --jar-dir release-dist
      - name: Publish to Modrinth only when explicitly requested
        # A release commit can opt in without enabling Modrinth for later pushes.
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_modrinth) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[publish-modrinth]') || contains(github.event.head_commit.message, '[publish-modrinth-neoforge]')))
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: hLV9sPrg
          MODRINTH_LOADER: ${{ github.event_name == 'workflow_dispatch' && inputs.modrinth_loader || (contains(github.event.head_commit.message, '[publish-modrinth-neoforge]') && 'neoforge' || 'both') }}
        run: python3 scripts/publish_release.py --publish --modrinth --modrinth-loader "$MODRINTH_LOADER" --jar-dir release-dist
      - name: Sync English Modrinth description
        id: modrinth-readme
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_modrinth) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[publish-modrinth]') || contains(github.event.head_commit.message, '[publish-modrinth-neoforge]')))
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: hLV9sPrg
        run: python3 scripts/publish_release.py --sync-readme
      - name: Report description sync permissions
        if: steps.modrinth-readme.outcome == 'failure'
        run: |
          echo '::warning::The release was published, but the Modrinth description could not be synchronized. Check the previous step; editing the project requires the PROJECT_WRITE token scope.'
          echo 'Modrinth description sync failed. See the Sync English Modrinth description step; PROJECT_WRITE is required in addition to version permissions.' >> "$GITHUB_STEP_SUMMARY"
