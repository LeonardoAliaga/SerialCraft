name: Build and test
on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --console=plain
      - run: ./gradlew -PioGameTests runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/
