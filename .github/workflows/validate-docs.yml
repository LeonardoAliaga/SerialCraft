name: Validate VitePress documentation

on:
  push:
    branches: [test]
    paths:
      - 'docs/**'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    branches: [test]
    paths:
      - 'docs/**'
      - '.github/workflows/validate-docs.yml'

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install VitePress dependencies
        working-directory: docs
        run: npm ci
      - name: Verify media slots with a temporary fixture (never deployed)
        working-directory: docs
        run: |
          # Upload-only contract: H02 must appear in Spanish and English when present.
          touch public/media/0.4.6/sc046-h02-arduino-cableado.webp
          npm run docs:build
          grep -q 'sc046-h02-arduino-cableado.webp' .vitepress/dist/tutoriales/arduino-led-minecraft.html
          grep -q 'sc046-h02-arduino-cableado.webp' .vitepress/dist/en/tutorials/arduino-led.html
          rm public/media/0.4.6/sc046-h02-arduino-cableado.webp
          # After removal, a fresh production build should have no broken image references.
          npm run docs:build
          if grep -q 'sc046-h02-arduino-cableado.webp' .vitepress/dist/tutoriales/arduino-led-minecraft.html; then
            echo 'ERROR: missing media remains in generated page' >&2
            exit 1
          fi

