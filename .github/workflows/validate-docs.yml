name: Validate VitePress documentation

on:
  push:
    branches: [main, test]
    paths:
      - 'docs/**'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    branches: [main, test]
    paths:
      - 'docs/**'
      - '.github/workflows/validate-docs.yml'

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install VitePress dependencies
        working-directory: docs
        run: npm ci
      - name: Setup Python for social previews and app icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate brand PNG assets
        run: |
          python -m pip install -r docs/scripts/requirements-brand.txt
          python docs/scripts/generate_brand_assets.py
      - name: Verify media slots with a temporary fixture (never deployed)
        working-directory: docs
        run: |
          # Upload-only contract: H02 must appear in Spanish and English when present.
          touch public/media/0.4.6/sc046-h02-arduino-cableado.webp
          npm run docs:build
          grep -q 'sc046-h02-arduino-cableado.webp' .vitepress/dist/tutoriales/arduino-led-minecraft.html
          grep -q 'sc046-h02-arduino-cableado.webp' .vitepress/dist/en/tutorials/arduino-led.html
          rm public/media/0.4.6/sc046-h02-arduino-cableado.webp
          # After removal, a fresh production build should have no broken image references.
          npm run docs:build
          if grep -q 'sc046-h02-arduino-cableado.webp' .vitepress/dist/tutoriales/arduino-led-minecraft.html; then
            echo 'ERROR: missing media remains in generated page' >&2
            exit 1
          fi

          # La documentación privada de producción no debe aparecer en el sitio.
          if find .vitepress/dist -type f -iname '*media*readme*.html' | grep -q .; then
            echo 'ERROR: a production guide was published' >&2
            exit 1
          fi
          if grep -R -l -E 'SC046_MEDIA:|Cómo agregar una foto, captura o video|contrato de medios' .vitepress/dist --include='*.html' | grep -q .; then
            echo 'ERROR: internal media production instructions leaked to website HTML' >&2
            exit 1
          fi

          # Las entradas historicas no pueden volver a devolver un 404.
          for version in v0.3.6 v0.4.3; do
            test -f ".vitepress/dist/versiones/${version}/index.html"
            test -f ".vitepress/dist/versiones/en/${version}/index.html"
          done
          # Mantener el recurso del hero y los links SEO publicados en ambos idiomas.
          test -s .vitepress/dist/media/serialcraft-mascot-v2.svg
          test -s .vitepress/dist/favicon.svg
          grep -q 'serialcraft-mascot-v2.svg' .vitepress/dist/index.html
          grep -q 'serialcraft-mascot-v2.svg' .vitepress/dist/en/index.html
          grep -q 'https://serialcraft.xyz/versiones/en/v0.3.6/' .vitepress/dist/versiones/en/v0.3.6/index.html
          grep -q 'hreflang="en"' .vitepress/dist/versiones/v0.3.6/index.html

          # Verify route-aware version selection across languages and sections.
          node scripts/check-version-routes.mjs
          grep -q 'version-routing' .vitepress/dist/assets/*.js || true

          # The uploaded favicon is shared by all locales and archived entries.
          for page in index.html en/index.html versiones/v0.3.6/index.html versiones/en/v0.3.6/index.html versiones/v0.4.3/index.html versiones/en/v0.4.3/index.html; do
            grep -q 'favicon.svg' ".vitepress/dist/$page"
          done
          grep -q 'viewBox="850 350 2700 3900"' .vitepress/dist/media/serialcraft-mascot-v2.svg
          grep -q 'VPHero.has-image .image-src' .vitepress/theme/home.css

          # Both localized social previews and mobile icons must exist in the build.
          test -s .vitepress/dist/apple-touch-icon.png
          test -s .vitepress/dist/icon-192.png
          test -s .vitepress/dist/icon-512.png
          test -s .vitepress/dist/og/serialcraft-es.png
          test -s .vitepress/dist/og/serialcraft-en.png
          test -s .vitepress/dist/site.webmanifest
          test -s .vitepress/dist/media/serialcraft-mascot-dark.svg
          grep -q 'serialcraft-mascot-dark.svg' .vitepress/dist/index.html
          grep -q 'serialcraft-mascot-dark.svg' .vitepress/dist/en/index.html
          grep -q 'https://serialcraft.xyz/og/serialcraft-es.png' .vitepress/dist/index.html
          grep -q 'https://serialcraft.xyz/og/serialcraft-en.png' .vitepress/dist/en/index.html
          grep -q 'summary_large_image' .vitepress/dist/index.html
          grep -q 'apple-touch-icon.png' .vitepress/dist/en/index.html
          grep -q 'site.webmanifest' .vitepress/dist/versiones/en/v0.3.6/index.html
          python - <<'PY'
          from PIL import Image
          assert Image.open('.vitepress/dist/apple-touch-icon.png').size == (180, 180)
          assert Image.open('.vitepress/dist/icon-192.png').size == (192, 192)
          assert Image.open('.vitepress/dist/icon-512.png').size == (512, 512)
          for lang in ('es', 'en'):
              assert Image.open(f'.vitepress/dist/og/serialcraft-{lang}.png').size == (1200, 630)
          PY
