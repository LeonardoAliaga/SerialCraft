plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
	}
	maven {
		url = 'https://oss.sonatype.org/content/repositories/snapshots'
	}
	maven {
		url = "https://maven.squiddev.cc"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"serialcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Sin línea "mappings": 26.2 ya no está ofuscado, no hace falta.

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.fazecast:jSerialComm:2.11.4"
	include "com.fazecast:jSerialComm:2.11.4"
	implementation 'org.jmdns:jmdns:3.5.8'
	include 'org.jmdns:jmdns:3.5.8'

	implementation include("me.lucko:fabric-permissions-api:0.7.0")
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

test {
	useJUnitPlatform()
}

// Optional world tests. EULA acceptance belongs to whoever runs the test server.
if (project.hasProperty('ioGameTests')) {
	fabricApi.configureTests {
		createSourceSet = true
		modId = 'serialcraft-io-tests'
		enableGameTests = true
		enableClientGameTests = false
		eula = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Only orders explicitly requested datagen; a normal build does not start Minecraft.
tasks.named('sourcesJar') {
	mustRunAfter tasks.named('runDatagen')
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
