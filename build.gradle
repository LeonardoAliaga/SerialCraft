plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
subprojects {
    apply plugin: 'java-library'
    base { archivesName = "${rootProject.archives_base_name}-${project.name}" }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.java_version as int
    }
    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        from(rootProject.file('LICENSE')) { rename { "${it}_serialcraft" } }
    }
}
tasks.named('build') { dependsOn ':common:build', ':fabric:build', ':neoforge:build' }
tasks.register('stageReleaseJars', Sync) {
    from(project(':fabric').tasks.named('jar'))
    from(project(':neoforge').tasks.named('jar'))
    into layout.buildDirectory.dir('libs')
}
tasks.named('build') { dependsOn 'stageReleaseJars' }
