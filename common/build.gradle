plugins { id 'net.fabricmc.fabric-loom' }
// Compile vanilla 26.2 without any loader APIs on the classpath.
loom { splitEnvironmentSourceSets() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    compileOnly "com.fazecast:jSerialComm:${jserialcomm_version}"
    compileOnly "org.jmdns:jmdns:${jmdns_version}"
}
// Existing tests run against the loaders rather than vanilla.
sourceSets.test.java.setSrcDirs([])
